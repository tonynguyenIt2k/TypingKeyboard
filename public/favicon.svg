<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="cap" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.92" />
    </linearGradient>
  </defs>
  <!-- Outer Mechanical Key Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bg)" />
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="15.25" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Inner Sculpted Keycap Dish -->
  <rect x="11" y="10" width="42" height="39" rx="10" fill="url(#cap)" />

  <!-- Stylized 10-Finger Rhythm Bars (Left 4 + Thumbs + Right 4) -->
  <rect x="16.5" y="24" width="3" height="9" rx="1.5" fill="#0F172A" />
  <rect x="21.5" y="20" width="3" height="13" rx="1.5" fill="#0F172A" />
  <rect x="26.5" y="17.5" width="3" height="15.5" rx="1.5" fill="#0284C7" />
  <rect x="31.5" y="19" width="3" height="14" rx="1.5" fill="#0284C7" />
  <rect x="36.5" y="17.5" width="3" height="15.5" rx="1.5" fill="#0284C7" />
  <rect x="41.5" y="20" width="3" height="13" rx="1.5" fill="#0F172A" />
  <rect x="46.5" y="24" width="3" height="9" rx="1.5" fill="#0F172A" />

  <!-- Tactile F & J Home Row Bumps -->
  <rect x="24" y="41" width="6.5" height="2.4" rx="1.2" fill="#0284C7" />
  <rect x="33.5" y="41" width="6.5" height="2.4" rx="1.2" fill="#0284C7" />

  <!-- Subtle Spacebar Glow Line at Base -->
  <rect x="20" y="53.5" width="24" height="2.5" rx="1.25" fill="#7DD3FC" fill-opacity="0.85" />
</svg>
